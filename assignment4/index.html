<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <title>Spökhusbyrån</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <h1>Spökhusbyrån</h1>
        </header>

        <main>
            <section>
                <h2>Filtrera</h2>
                <form id="filter-form">
                    <label>Maxpris:
                        <input type="number" id="price" value="3000">
                    </label>

                    <label>Skräcknivå:
                        <input type="range" id="scare" min="1" max="5" value="1">
                        <span id="scare-value"></span>
                    </label>

                    <label>Spöktyp:
                        <select id="ghost">
                            <option value="all">Alla</option>
                        </select>
                    </label>

                    <label>
                        <input type="checkbox" id="wifi"> WiFi
                    </label>
                </form>
            </section>

            <section id="houses-container"></section>
        </main>
        <script type="module" src="js/index.js"></script>
    </body>
</html>
